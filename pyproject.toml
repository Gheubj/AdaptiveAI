[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptiveai"
version = "0.1.0"
description = "Hardware-aware, quality-constrained LLM routing research infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
local = []
research = [
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<20",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "sentence-transformers>=5.7,<6",
  "torch>=2.4,<3",
]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1", "build>=1.2,<2"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
adaptiveai = "adaptiveai.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptiveai"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/data/raw/**",
  "/data/models/**",
  "/data/processed/**",
  "/data/catalog/**",
  "/vendor/**",
  "/reports/**",
  "/planning/**",
  "/dist/**",
  "/.venv/**",
  "/.coverage",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "real_data: optional integration test requiring ADAPTIVEAI_REAL_ARCHIVE",
  "real_local: optional llama.cpp smoke test requiring ADAPTIVEAI_REAL_LOCAL=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

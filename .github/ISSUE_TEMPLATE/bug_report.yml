name: Bug report
description: Report a reproducible AdaptiveAI problem without secrets or private prompts.
title: "[Bug]: "
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Include version, Python version, configuration with secrets removed, and steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, private prompts, model weights and restricted data.
          required: true
